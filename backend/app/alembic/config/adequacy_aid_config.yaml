# New Hampshire adequacy aid ("adequate education grants"): NH DOE's calculation for each town (RSA 198:40-a to
# 198:42), and how each town's grant and statewide education property tax (SWEPT) divide among its school districts.
#
# Each year has two DOE workbooks, saved in assets/adequacy-aid. The DOE's site blocks scripted downloads, so new
# ones are saved through a browser from
# https://www.education.nh.gov/who-we-are/division-of-education-and-analytic-resources/bureau-school-finance/state-adequacy-aid-funding
# - summary: one row per town (column town_column is the DOE's town number, our town id) with every part of the
#   calculation; columns maps each part to its column, and state_row is the DOE's statewide totals
# - split: for towns in more than one district (an elementary district and a cooperative), each district's share
#   of the town's grant and SWEPT. Every other town's grant goes to its one district (town_district_xref, or
#   town_districts below). town_fixes corrects a town number the DOE's file gets wrong, by the row's name.
#
# components: every part of the calculation in any year. role: students, cost (an aid line), cost_total, swept,
# added_aid, hold_harmless, result or basis (values used along the way).
#
# Each year's parameters (rates, thresholds, shares) and steps say how that year's calculation works. A step's
# formula, over component and parameter codes, must reproduce the DOE's published value for every town to within
# tolerance dollars, or the load stops; a component a town has no value for counts as 0. Steps without a formula
# are explained but not checked (the DOE's rule isn't fully published). Values are stored as the DOE publishes
# them; nothing is recomputed. A year is named by its fiscal year (2027: 2026-27), as doe_form.year is.
#
# To add a year: save its two workbooks, add a block (copy the previous year's, then its columns, parameters from
# the DOE's explanation of the year, and steps), and load.
directory: ../assets/adequacy-aid
town_districts:
  Concord:
  - Concord
# Unincorporated places in the DOE's workbooks: these, by the DOE's number, and each year's unincorporated_rows below
# the towns (lettered a to o). They have no students, no town row and no school district; their SWEPT (and, in
# FY2023, small SWEPT hold-harmless grants) counts in the state totals but isn't any district's.
unincorporated:
  73: Cambridge
  133: Dix's Grant
  134: Dixville
  344: Martin's Location
  414: Odell
  436: Pinkham's Grant
  514: Success
  561: Wentworth's Location
components:
- code: resident_adm_base
  name: Resident students (ADM)
  description: Average daily membership of the students who live in the town, from the year before (charter and preschool students aren't counted)
  unit: count
  role: students
- code: frl_adm
  name: Free or reduced-price meal students
  description: Resident students eligible for free or reduced-price meals, by average daily membership
  unit: count
  role: students
- code: sped_adm
  name: Special education students
  description: Resident students with an individualized education program (IEP), by average daily membership
  unit: count
  role: students
- code: ell_adm
  name: English learners
  description: Resident students receiving English language instruction, by average daily membership
  unit: count
  role: students
- code: home_education_adm
  name: Home-educated students taking district courses
  description: 0.15 ADM for each course credit a home-educated student takes at a district school
  unit: count
  role: students
- code: grade3_reading_adm
  name: Third graders below proficient in reading
  description: Third graders whose state reading score was below proficient and who aren't counted in another group (through FY2023)
  unit: count
  role: students
- code: base_adequacy_aid
  name: Base adequacy aid
  description: Resident students at the base rate per student
  unit: dollars
  role: cost
- code: frl_differentiated_aid
  name: Free or reduced-price meal aid
  description: The extra rate for each student eligible for free or reduced-price meals
  unit: dollars
  role: cost
- code: sped_differentiated_aid
  name: Special education aid
  description: The extra rate for each special education student
  unit: dollars
  role: cost
- code: ell_differentiated_aid
  name: English learner aid
  description: The extra rate for each English learner
  unit: dollars
  role: cost
- code: home_education_aid
  name: Home education aid
  description: Home-educated students' course credits at the base rate
  unit: dollars
  role: cost
- code: grade3_reading_differentiated_aid
  name: Third-grade reading aid
  description: The extra rate for each third grader below proficient in reading (through FY2023)
  unit: dollars
  role: cost
- code: total_cost_adequate_education
  name: Cost of an adequate education
  description: 'The town''s cost of an opportunity for an adequate education: the base and extra aid added up'
  unit: dollars
  role: cost_total
- code: swept
  name: Statewide education property tax (SWEPT)
  description: The state education tax raised in the town, which it keeps for its schools and which counts toward the cost
  unit: dollars
  role: swept
- code: extraordinary_need_grant
  name: Extraordinary need grant
  description: Extra aid for towns with low property value per free or reduced-price meal student
  unit: dollars
  role: added_aid
- code: fiscal_capacity_disparity_aid
  name: Fiscal capacity disparity aid
  description: Extra aid for towns with low property value per student (FY2021, and again from FY2027)
  unit: dollars
  role: added_aid
- code: frl_additional_aid
  name: Additional free or reduced-price meal aid
  description: One-time FY2021 aid on a sliding scale for towns with more than 12% of students eligible for free or reduced-price meals
  unit: dollars
  role: added_aid
- code: relief_aid_grant
  name: Relief aid
  description: FY2022-FY2023 aid on a sliding scale by the share of students eligible for free or reduced-price meals, prorated to $17.5 million
    statewide
  unit: dollars
  role: added_aid
- code: stabilization_grant
  name: Stabilization grant
  description: The town's FY2012 stabilization grant, paid through FY2023 to towns whose cost is more than their SWEPT
  unit: dollars
  role: added_aid
- code: preliminary_grant
  name: Preliminary grant
  description: Cost minus SWEPT, plus that year's added aid; never below $0
  unit: dollars
  role: result
- code: hold_harmless_grant
  name: Hold-harmless grant
  description: Aid that limits a drop from an earlier year's grant or estimate
  unit: dollars
  role: hold_harmless
- code: hold_harmless_95pct_grant
  name: 95% guarantee
  description: Aid that brings the final grant up to 95% of the November estimate
  unit: dollars
  role: hold_harmless
- code: swept_hold_harmless_grant
  name: SWEPT reduction hold-harmless grant
  description: FY2023 aid for towns whose total grant was lower with the $100 million SWEPT reduction than without it
  unit: dollars
  role: hold_harmless
- code: adequacy_grant
  name: Adequacy grant
  description: What the state pays the town's school district or districts
  unit: dollars
  role: result
- code: final_total_state_grant
  name: Total state aid
  description: The adequacy grant plus the SWEPT the town keeps
  unit: dollars
  role: result
- code: equalized_valuation
  name: Equalized valuation
  description: The town's property value at full market value, including utilities, railroads and payments in lieu of taxes
  unit: dollars
  role: basis
- code: ev_per_frl_pupil
  name: Valuation per free or reduced-price meal student
  description: 'Equalized valuation divided by free or reduced-price meal students: the measure for extraordinary need grants'
  unit: dollars_per_pupil
  role: basis
- code: extraordinary_need_aid_per_frl_adm
  name: Extraordinary need aid per student
  description: The extraordinary need grant per free or reduced-price meal student, from the sliding scale
  unit: dollars_per_pupil
  role: basis
- code: ev_per_pupil
  name: Valuation per student
  description: 'Equalized valuation divided by resident students: the measure for fiscal capacity disparity aid'
  unit: dollars_per_pupil
  role: basis
- code: frl_pct_eligible
  name: Share eligible for free or reduced-price meals
  description: Free or reduced-price meal students as a share of all students (FY2021)
  unit: fraction
  role: basis
- code: relief_aid_frl_pct
  name: Share eligible for free or reduced-price meals
  description: Free or reduced-price meal students as a share of resident students, for relief aid
  unit: fraction
  role: basis
- code: relief_aid_unprorated
  name: Relief aid before proration
  description: Relief aid from the sliding scale, before it's prorated to $17.5 million statewide
  unit: dollars
  role: basis
- code: fy2012_stabilization_grant
  name: FY2012 stabilization amount
  description: The stabilization grant the town received in FY2012, the basis of later stabilization grants
  unit: dollars
  role: basis
- code: hold_harmless_95pct_of_prior_estimate
  name: 95% of the November estimate
  description: 'The minimum grant: 95% of the November estimate for the year (FY2020-FY2023)'
  unit: dollars
  role: basis
- code: prior_estimate_nov2018
  name: November 2018 estimate
  description: The November 15, 2018 estimate of the FY2020 grant
  unit: dollars
  role: basis
- code: prior_estimate_nov2019
  name: November 2019 estimate
  description: The November 15, 2019 estimate of the FY2021 grant
  unit: dollars
  role: basis
- code: prior_estimate_nov2022
  name: November 2022 estimate of FY2024
  description: The November 15, 2022 estimate of the FY2024 grant, the basis of the FY2024-FY2025 hold-harmless grant
  unit: dollars
  role: basis
- code: prior_estimate_nov2022_of_fy2024
  name: November 2022 estimate of FY2024
  description: The November 15, 2022 estimate of the FY2024 grant, the basis of the FY2025 hold-harmless grant
  unit: dollars
  role: basis
- code: hold_harmless_104pct_of_prior_estimate
  name: 104% of the November 2022 estimate
  description: The level the FY2024-FY2025 hold-harmless grant brings a town up to
  unit: dollars
  role: basis
- code: hold_harmless_95pct_level_nov2023_estimate
  name: November 2023 estimate
  description: The November 15, 2023 estimate of the FY2025 grant, 95% of which is guaranteed
  unit: dollars
  role: basis
- code: hold_harmless_95pct_level_nov2024_estimate
  name: November 2024 estimate
  description: The November 15, 2024 estimate of the FY2026 grant, 95% of which is guaranteed
  unit: dollars
  role: basis
- code: hold_harmless_95pct_level_nov2025_estimate
  name: November 2025 estimate
  description: The November 15, 2025 estimate of the FY2027 grant, 95% of which is guaranteed
  unit: dollars
  role: basis
- code: fy2025_hold_harmless_grant
  name: FY2025 hold-harmless grant
  description: The town's FY2025 hold-harmless grant, the basis of the FY2026-FY2027 hold-harmless grants
  unit: dollars
  role: basis
- code: swept_without_100m_reduction
  name: SWEPT without the $100 million reduction
  description: What the town's SWEPT would have been in FY2023 had $363 million been raised statewide
  unit: dollars
  role: basis
- code: total_grant_for_swept_hold_harmless_test
  name: Total grant without the SWEPT reduction
  description: The FY2023 total grant with the $363 million SWEPT, compared to decide the SWEPT hold-harmless grant
  unit: dollars
  role: basis
- code: adm_2019_20
  name: Resident students, 2019-20
  description: Average daily membership in 2019-20, compared during COVID
  unit: count
  role: basis
- code: adm_2020_21
  name: Resident students, 2020-21
  description: Average daily membership in 2020-21, compared during COVID
  unit: count
  role: basis
- code: frl_adm_2019_20
  name: Free or reduced-price meal students, 2019-20
  description: Compared during COVID
  unit: count
  role: basis
- code: frl_adm_2020_21
  name: Free or reduced-price meal students, 2020-21
  description: Compared during COVID
  unit: count
  role: basis
- code: frl_adm_2021_22
  name: Free or reduced-price meal students, 2021-22
  description: Compared with the pre-COVID ratio in FY2023
  unit: count
  role: basis
- code: frl_pct_2019_20
  name: Share eligible for free or reduced-price meals, 2019-20
  description: The pre-COVID share used to rebuild FY2023's counts
  unit: fraction
  role: basis
- code: frl_adm_modified_precovid_ratio
  name: Free or reduced-price meal students by the pre-COVID share
  description: Resident students times the 2019-20 share (FY2023)
  unit: count
  role: basis
- code: sped_adm_2019_20
  name: Special education students, 2019-20
  description: Compared during COVID
  unit: count
  role: basis
- code: sped_adm_2020_21
  name: Special education students, 2020-21
  description: Compared during COVID
  unit: count
  role: basis
- code: ell_adm_2019_20
  name: English learners, 2019-20
  description: Compared during COVID
  unit: count
  role: basis
- code: ell_adm_2020_21
  name: English learners, 2020-21
  description: Compared during COVID
  unit: count
  role: basis
- code: grade3_reading_adm_2018_19
  name: Third graders below proficient in reading, 2018-19
  description: Compared during COVID
  unit: count
  role: basis
- code: grade3_reading_adm_2020_21
  name: Third graders below proficient in reading, 2020-21
  description: Compared during COVID
  unit: count
  role: basis
