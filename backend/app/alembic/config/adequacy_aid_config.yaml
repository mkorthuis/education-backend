        unit: dollars_per_pupil
        citation: RSA 198:40-a, II(c); DOE FY2020 explanation
        source_url: https://www.education.nh.gov/sites/g/files/ehbemt326/files/inline-documents/fy2020_explained.pdf
      ell_per_pupil:
