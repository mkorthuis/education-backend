        source_url: https://www.education.nh.gov/sites/g/files/ehbemt326/files/inline-documents/fy2021_explained.pdf
      frl_additional_min_per_pupil:
        name: Least additional aid per F&R student
        value: 87.5
        unit: dollars_per_pupil
        citation: DOE FY2021 explanation
        source_url: https://www.education.nh.gov/sites/g/files/ehbemt326/files/inline-documents/fy2021_explained.pdf
      frl_additional_max_per_pupil:
        name: Most additional aid per F&R student
        value: 350
        unit: dollars_per_pupil
        citation: DOE FY2021 explanation
        source_url: https://www.education.nh.gov/sites/g/files/ehbemt326/files/inline-documents/fy2021_explained.pdf
    steps:
    - component: base_adequacy_aid
      formula: resident_adm_base * base_per_pupil
      tolerance: 0.02
      explanation: Every resident student at the base rate, $3,708.78 per student
      citation: RSA 198:40-a, II(a)
    - component: frl_differentiated_aid
      formula: frl_adm * frl_per_pupil
      tolerance: 0.02
      explanation: $1,854.38 more for each student eligible for free or reduced-price meals
      citation: RSA 198:40-a, II(b)
    - component: sped_differentiated_aid
      formula: sped_adm * sped_per_pupil
      tolerance: 0.02
      explanation: $1,995.21 more for each special education student
      citation: RSA 198:40-a, II(c)
    - component: ell_differentiated_aid
      formula: ell_adm * ell_per_pupil
      tolerance: 0.02
      explanation: $725.63 more for each English learner
      citation: RSA 198:40-a, II(d)
    - component: grade3_reading_differentiated_aid
      formula: grade3_reading_adm * grade3_reading_per_pupil
      tolerance: 0.02
      explanation: $725.63 more for each third grader below proficient in reading
      citation: RSA 198:40-a, II (before July 1, 2023)
    - component: home_education_aid
      formula: home_education_adm * base_per_pupil
      tolerance: 0.02
      explanation: Home-educated students' district course credits, 0.15 ADM each, at the base rate
      citation: DOE FY2021 explanation
    - component: total_cost_adequate_education
      formula: base_adequacy_aid + frl_differentiated_aid + sped_differentiated_aid + ell_differentiated_aid + grade3_reading_differentiated_aid
        + home_education_aid
      tolerance: 0.02
      explanation: 'The town''s cost of an adequate education: the lines above added up'
      citation: RSA 198:40-a, III
    - component: swept
      formula: null
      tolerance: 0.02
      explanation: The statewide education property tax raised in the town ($1.925 per $1,000 of its equalized valuation), which it keeps and
        which counts toward the cost
      citation: RSA 76:3, 76:8; RSA 198:41, I(b)
    - component: frl_additional_aid
      formula: null
      tolerance: 0.02
      explanation: One-time aid of $87.50 to $350 per free or reduced-price meal student for towns where more than 12% of students are eligible
      citation: DOE FY2021 explanation
    - component: fiscal_capacity_disparity_aid
      formula: null
      tolerance: 0.02
      explanation: One-time aid of up to $1,750 per student for towns with equalized valuation of $1 million or less per student
      citation: DOE FY2021 explanation
    - component: preliminary_grant
      formula: max(0, total_cost_adequate_education - swept + frl_additional_aid + fiscal_capacity_disparity_aid)
      tolerance: 0.02
      explanation: Cost minus SWEPT plus the one-time aid, never below $0
      citation: RSA 198:41, I; DOE FY2021 explanation
    - component: stabilization_grant
      formula: fy2012_stabilization_grant * (preliminary_grant > 0) * (resident_adm_base > 0)
      tolerance: 0.02
      explanation: The town's FY2012 stabilization grant, at 100%, if its preliminary grant and students are above zero
      citation: RSA 198:41, III; DOE FY2021 explanation
    - component: adequacy_grant
      formula: max(preliminary_grant + stabilization_grant, hold_harmless_95pct_of_prior_estimate)
      tolerance: 0.02
      explanation: The preliminary grant plus stabilization, but at least 95% of the November 15, 2019 estimate
      citation: RSA 198:41, VI
