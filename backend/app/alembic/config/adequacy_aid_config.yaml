    steps:
    - component: base_adequacy_aid
      formula: resident_adm_base * base_per_pupil
      tolerance: 0.02
      explanation: Every resident student at the base rate, $4,100 per student
      citation: RSA 198:40-a, II(a)
    - component: frl_differentiated_aid
      formula: frl_adm * frl_per_pupil
      tolerance: 0.02
      explanation: $2,300 more for each student eligible for free or reduced-price meals
      citation: RSA 198:40-a, II(b)
    - component: sped_differentiated_aid
      formula: sped_adm * sped_per_pupil
      tolerance: 0.02
      explanation: $2,100 more for each special education student
      citation: RSA 198:40-a, II(c)
    - component: ell_differentiated_aid
      formula: ell_adm * ell_per_pupil
      tolerance: 0.02
      explanation: $800 more for each English learner
      citation: RSA 198:40-a, II(d)
    - component: total_cost_adequate_education
      formula: base_adequacy_aid + frl_differentiated_aid + sped_differentiated_aid + ell_differentiated_aid
