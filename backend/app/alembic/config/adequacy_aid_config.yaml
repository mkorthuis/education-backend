      citation: RSA 198:40-a, II(b)
    - component: sped_differentiated_aid
      formula: sped_adm * sped_per_pupil
      tolerance: 0.02
      explanation: $2,037.11 more for each special education student
      citation: RSA 198:40-a, II(c)
    - component: ell_differentiated_aid
      formula: ell_adm * ell_per_pupil
      tolerance: 0.02
      explanation: $740.87 more for each English learner
      citation: RSA 198:40-a, II(d)
    - component: grade3_reading_differentiated_aid
      formula: grade3_reading_adm * grade3_reading_per_pupil
      tolerance: 0.02
      explanation: $740.87 more for each third grader below proficient in reading
      citation: RSA 198:40-a, II (before July 1, 2023)
    - component: total_cost_adequate_education
      formula: base_adequacy_aid + frl_differentiated_aid + sped_differentiated_aid + ell_differentiated_aid + grade3_reading_differentiated_aid
      tolerance: 0.02
      explanation: 'The town''s cost of an adequate education: the lines above added up'
      citation: RSA 198:40-a, III
    - component: swept
      formula: null
      tolerance: 0.02
      explanation: The statewide education property tax raised in the town ($1.23 per $1,000 of its equalized valuation), which it keeps and which
        counts toward the cost
      citation: RSA 76:3, 76:8; RSA 198:41, I(b)
    - component: relief_aid_unprorated
      formula: null
      tolerance: 0.02
      explanation: Relief aid from $150 per free or reduced-price meal student at 12% of students to $600 at 48% or more
      citation: DOE FY2023 explanation
    - component: relief_aid_grant
      formula: relief_aid_unprorated * relief_aid_proration
      tolerance: 0.02
      explanation: Relief aid, prorated so it totals $17.5 million statewide
      citation: DOE FY2023 explanation
    - component: extraordinary_need_grant
      formula: frl_adm * clamp(eng_factor * (eng_ceiling - ev_per_frl_pupil), 0, eng_max_per_pupil)
      tolerance: 0.02
      explanation: 'Towns with low property value per free or reduced-price meal student get up to $650 per such student: the full amount below
        $1,000,000 of valuation per student, falling to $0 at $6,000,000'
      citation: DOE FY2023 workbook and explanation
    - component: preliminary_grant
      formula: max(0, total_cost_adequate_education - swept) + relief_aid_grant + extraordinary_need_grant
      tolerance: 0.02
      explanation: Cost minus SWEPT (never below $0), plus relief aid and the extraordinary need grant
      citation: RSA 198:41, I; DOE FY2023 explanation
    - component: stabilization_grant
      formula: fy2012_stabilization_grant * (resident_adm_base > 0) * (total_cost_adequate_education > swept)
      tolerance: 0.02
      explanation: The town's FY2012 stabilization grant, at 100%, if it has students and its cost is more than its SWEPT
      citation: RSA 198:41, III; DOE FY2023 explanation
    - component: swept_hold_harmless_grant
      formula: null
      tolerance: 0.02
      explanation: SWEPT was cut to $263 million statewide for FY2023; towns whose total grant was lower as a result got the difference
      citation: DOE FY2023 explanation
    - component: adequacy_grant
      formula: max(preliminary_grant + stabilization_grant + swept_hold_harmless_grant, hold_harmless_95pct_of_prior_estimate)
      tolerance: 0.02
      explanation: The preliminary grant plus stabilization and the SWEPT hold-harmless grant, but at least 95% of the November estimate
      citation: RSA 198:41, VI
    - component: final_total_state_grant
      formula: adequacy_grant + swept
      tolerance: 0.02
      explanation: 'Total state aid: the adequacy grant plus the SWEPT the town keeps'
      citation: DOE FY2023 workbook
