    - component: swept
      formula: null
      tolerance: 0.02
      explanation: The statewide education property tax raised in the town ($1.44 per $1,000 of its equalized valuation), which it keeps and which
        counts toward the cost
      citation: RSA 76:3, 76:8; RSA 198:41, I(b)
    - component: extraordinary_need_aid_per_frl_adm
      formula: clamp(eng_factor * (eng_ceiling - ev_per_frl_pupil), 0, eng_max_per_pupil)
      tolerance: 0.02
      explanation: 'Towns with low property value per free or reduced-price meal student get up to $8,500 per such student: the full amount below
        $1,600,000 of valuation per student, falling to $0 at $6,600,000'
      citation: RSA 198:40-f
    - component: extraordinary_need_grant
      formula: frl_adm * extraordinary_need_aid_per_frl_adm
      tolerance: 0.02
      explanation: The aid per free or reduced-price meal student, for each such student
      citation: RSA 198:40-f
    - component: preliminary_grant
      formula: max(0, total_cost_adequate_education - swept + extraordinary_need_grant)
      tolerance: 0.02
      explanation: Cost minus SWEPT, plus the extraordinary need grant; never below $0
      citation: RSA 198:41, I
    - component: hold_harmless_grant
      formula: max(0, hold_harmless_estimate_share * prior_estimate_nov2022 - preliminary_grant)
      tolerance: 0.02
      explanation: Brings the town up to 104% of the DOE's November 15, 2022 estimate of its FY2024 grant
      citation: RSA 198:41; DOE FY2024 explanation
    - component: adequacy_grant
      formula: preliminary_grant + hold_harmless_grant
      tolerance: 0.02
      explanation: The preliminary grant plus the hold-harmless grant
      citation: RSA 198:41
    - component: final_total_state_grant
      formula: adequacy_grant + swept
      tolerance: 0.02
      explanation: 'Total state aid: the adequacy grant plus the SWEPT the town keeps'
      citation: DOE workbook
