    steps:
    - component: base_adequacy_aid
      formula: resident_adm_base * base_per_pupil
      tolerance: 0.02
      explanation: Every resident student at the base rate, $4,265.64 per student
      citation: RSA 198:40-a, II(a)
    - component: frl_differentiated_aid
      formula: frl_adm * frl_per_pupil
      tolerance: 0.02
      explanation: $2,392.92 more for each student eligible for free or reduced-price meals
      citation: RSA 198:40-a, II(b)
    - component: sped_differentiated_aid
      formula: sped_adm * sped_per_pupil
      tolerance: 0.02
      explanation: $2,184.84 more for each special education student
      citation: RSA 198:40-a, II(c)
    - component: ell_differentiated_aid
      formula: ell_adm * ell_per_pupil
      tolerance: 0.02
      explanation: $832.32 more for each English learner
      citation: RSA 198:40-a, II(d)
    - component: home_education_aid
      formula: home_education_adm * base_per_pupil
      tolerance: 0.02
      explanation: Home-educated students' district course credits, 0.15 ADM each, at the base rate
      citation: DOE FY2026 explanation
    - component: total_cost_adequate_education
      formula: base_adequacy_aid + frl_differentiated_aid + sped_differentiated_aid + ell_differentiated_aid + home_education_aid
      tolerance: 0.02
      explanation: 'The town''s cost of an adequate education: the lines above added up'
      citation: RSA 198:40-a, III
    - component: swept
      formula: null
      tolerance: 0.02
      explanation: The statewide education property tax raised in the town ($1.12 per $1,000 of its equalized valuation), which it keeps and which
        counts toward the cost
      citation: RSA 76:3, 76:8; RSA 198:41, I(b)
    - component: extraordinary_need_aid_per_frl_adm
      formula: clamp(eng_factor * (eng_ceiling - ev_per_frl_pupil), 0, eng_max_per_pupil)
      tolerance: 0.02
      explanation: 'Towns with low property value per free or reduced-price meal student get up to $11,500 per such student: the full amount below
        $1,664,640 of valuation per student, falling to $0 at $6,866,640'
      citation: RSA 198:40-f
    - component: extraordinary_need_grant
      formula: frl_adm * extraordinary_need_aid_per_frl_adm
      tolerance: 0.02
      explanation: The aid per free or reduced-price meal student, for each such student
      citation: RSA 198:40-f
    - component: preliminary_grant
      formula: max(0, total_cost_adequate_education - swept + extraordinary_need_grant)
      tolerance: 0.02
      explanation: Cost minus SWEPT, plus the extraordinary need grant; never below $0
      citation: RSA 198:41, I
    - component: hold_harmless_grant
      formula: hold_harmless_share * fy2025_hold_harmless_grant
      tolerance: 0.02
      explanation: 80% of the town's FY2025 hold-harmless grant
      citation: RSA 198:41; DOE FY2026 explanation
    - component: hold_harmless_95pct_grant
      formula: max(0, guarantee_share * hold_harmless_95pct_level_nov2024_estimate - preliminary_grant - hold_harmless_grant)
      tolerance: 0.02
      explanation: Brings the grant up to 95% of the DOE's November 15, 2024 estimate
      citation: RSA 198:41, VI
    - component: adequacy_grant
      formula: preliminary_grant + hold_harmless_grant + hold_harmless_95pct_grant
      tolerance: 0.02
      explanation: The preliminary grant plus the hold-harmless grants
      citation: RSA 198:41
    - component: final_total_state_grant
      formula: adequacy_grant + swept
      tolerance: 0.02
      explanation: 'Total state aid: the adequacy grant plus the SWEPT the town keeps'
      citation: DOE workbook
