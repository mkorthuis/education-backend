      citation: DOE FY2022 explanation
    - component: frl_adm
      formula: max(frl_adm_2019_20, frl_adm_2020_21)
      tolerance: 0.02
      explanation: 'Free or reduced-price meal students: the greater of 2019-20 and 2020-21'
      citation: DOE FY2022 explanation
    - component: sped_adm
      formula: max(sped_adm_2019_20, sped_adm_2020_21)
      tolerance: 0.02
      explanation: 'Special education students: the greater of 2019-20 and 2020-21'
      citation: DOE FY2022 explanation
    - component: ell_adm
      formula: max(ell_adm_2019_20, ell_adm_2020_21)
      tolerance: 0.02
      explanation: 'English learners: the greater of 2019-20 and 2020-21'
      citation: DOE FY2022 explanation
    - component: grade3_reading_adm
      formula: max(grade3_reading_adm_2018_19, grade3_reading_adm_2020_21)
      tolerance: 0.02
      explanation: 'Third graders below proficient: the greater of 2018-19 and 2020-21'
      citation: DOE FY2022 explanation
    - component: base_adequacy_aid
      formula: resident_adm_base * base_per_pupil
      tolerance: 0.02
      explanation: Every resident student at the base rate, $3,786.66 per student
      citation: RSA 198:40-a, II(a)
    - component: frl_differentiated_aid
      formula: frl_adm * frl_per_pupil
      tolerance: 0.02
      explanation: $1,893.32 more for each student eligible for free or reduced-price meals
      citation: RSA 198:40-a, II(b)
    - component: sped_differentiated_aid
      formula: sped_adm * sped_per_pupil
      tolerance: 0.02
      explanation: $2,037.11 more for each special education student
      citation: RSA 198:40-a, II(c)
    - component: ell_differentiated_aid
      formula: ell_adm * ell_per_pupil
      tolerance: 0.02
      explanation: $740.87 more for each English learner
      citation: RSA 198:40-a, II(d)
    - component: grade3_reading_differentiated_aid
      formula: grade3_reading_adm * grade3_reading_per_pupil
      tolerance: 0.02
      explanation: $740.87 more for each third grader below proficient in reading
      citation: RSA 198:40-a, II (before July 1, 2023)
    - component: total_cost_adequate_education
      formula: base_adequacy_aid + frl_differentiated_aid + sped_differentiated_aid + ell_differentiated_aid + grade3_reading_differentiated_aid
      tolerance: 0.02
      explanation: 'The town''s cost of an adequate education: the lines above added up'
      citation: RSA 198:40-a, III
    - component: swept
      formula: null
      tolerance: 0.02
      explanation: The statewide education property tax raised in the town ($1.825 per $1,000 of its equalized valuation), which it keeps and
        which counts toward the cost
      citation: RSA 76:3, 76:8; RSA 198:41, I(b)
    - component: relief_aid_unprorated
      formula: null
      tolerance: 0.02
      explanation: Relief aid from $150 per free or reduced-price meal student at 12% of students to $600 at 48% or more
      citation: DOE FY2022 explanation
    - component: relief_aid_grant
      formula: relief_aid_unprorated * relief_aid_proration
      tolerance: 0.02
      explanation: Relief aid, prorated so it totals $17.5 million statewide
      citation: DOE FY2022 explanation
    - component: preliminary_grant
      formula: max(0, total_cost_adequate_education - swept) + relief_aid_grant
      tolerance: 0.02
      explanation: Cost minus SWEPT (never below $0), plus relief aid
      citation: RSA 198:41, I; DOE FY2022 explanation
    - component: stabilization_grant
      formula: fy2012_stabilization_grant * (resident_adm_base > 0) * (total_cost_adequate_education > swept)
      tolerance: 0.02
      explanation: The town's FY2012 stabilization grant, at 100%, if it has students and its cost is more than its SWEPT
      citation: RSA 198:41, III; DOE FY2022 explanation
    - component: adequacy_grant
      formula: max(preliminary_grant + stabilization_grant, hold_harmless_95pct_of_prior_estimate)
      tolerance: 0.02
      explanation: The preliminary grant plus stabilization, but at least 95% of the November 15, 2020 estimate
      citation: RSA 198:41, VI
    - component: final_total_state_grant
      formula: adequacy_grant + swept
      tolerance: 0.02
      explanation: 'Total state aid: the adequacy grant plus the SWEPT the town keeps'
      citation: DOE FY2022 workbook
