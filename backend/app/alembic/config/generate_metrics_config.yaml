file_settings:
  year_start: "2016"
  year_end: "2024"
  # Each workbook holds three years. Files are read in this order, which sets the
  # insert order (and so the ids) of a fresh build: add new workbooks at the end.
  files:
    - path: "../assets/2024-school-metrics.xlsx"
      years: [2022, 2023, 2024]
    - path: "../assets/2021-school-metrics.xlsx"
      years: [2019, 2020, 2021]
    - path: "../assets/2018-school-metrics.xlsx"
      years: [2016, 2017, 2018]

column_mappings:
  entity_id: "Entity ID"
  entity_type: "School / District"
  indicator_category: "Indicator Category"
  indicator_name: "Indicator Name"

special_values:
  null_values: ["NA", "N/A", "*N", "*CS"]
  skip_patterns: ["*CS"]
