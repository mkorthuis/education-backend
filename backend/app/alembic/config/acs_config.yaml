# Census Bureau American Community Survey (ACS) 5-year estimates for New Hampshire's towns, school
# districts and the state: income, poverty, housing, children, families, education, language, work,
# health insurance and internet. Every value has a margin of error (90% confidence).
#
# `python -m app.etl fetch acs` reads each release's summary files from www2.census.gov (no API key:
# one pipe-delimited file per table covering the whole country) and keeps New Hampshire's rows: the
# state (040), its county subdivisions (060: towns, cities, and the unincorporated grants and
# purchases) and its elementary (950), secondary (960) and unified (970) school districts. It saves
# them, with the tables' labels, to assets/acs/acs5-<year>.json.gz. `load acs` loads every release.
#
# A release is named by the last year of its five (2024: 2020-2024). Census advises against comparing
# overlapping periods, so history skips ahead five years. Dollars are in the release's last year's
# dollars. The 2015-2019 files are in Census's "prototype" folder: the same table-based format, made
# before Census switched to it for 2021.
#
# acs_variables.csv lists every value loaded: its column name in the views, unit and description.
# Each table's lines must all be listed there, and every line listed must be in the latest release.
directory: "../assets/acs"
state_fips: "33"
releases:
  2024:
    period: 2020-2024
    base_url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF
    data: data/5YRData/acsdt5y2024-{table}.dat
    geographies: documentation/Geos20245YR.txt
    shells: documentation/ACS20245YR_Table_Shells.txt
  2019:
    period: 2015-2019
    base_url: https://www2.census.gov/programs-surveys/acs/summary_file/2019/prototype
    data: 5YRData/acsdt5y2019-{table}.dat
    shells: ACS2019_Table_Shells.csv

# acs_annotation: the codes the summary files give in place of a number. A controlled estimate (one
# Census sets to match its population estimates) has no sampling error, so its margin of error is 0.
annotations:
  1: { code: -666666666, name: "Estimate can't be computed: too few sample observations" }
  2: { code: -999999999, name: "Too few sample observations to compute" }
  3: { code: -888888888, name: "Not applicable" }
  4: { code: -555555555, name: "Controlled: no sampling error" }
  5: { code: -333333333, name: "Margin of error can't be computed: the median is in an open-ended range" }
  6: { code: -222222222, name: "Margin of error can't be computed: too few sample observations" }

# Reliability by coefficient of variation (the standard error as a percent of the estimate): high up to
# `high`, use with caution up to `caution`, low above. 30% is Census's own ceiling for key estimates.
reliability:
  high: 15
  caution: 30

# County subdivisions by Census's name, before the county. "Conway town" matches the town Conway;
# these don't match their town's name.
town_aliases:
  "Hale's location": "Hale's Location"
  "Millsfield township": Millsfield
# County subdivisions with no row in the town table: unincorporated places, and Livermore, which has no
# residents. They count in the state's figures, which come from Census directly. (Wentworth location is in
# Coos County; the town Wentworth is "Wentworth town", in Grafton County.)
skip_towns:
  - Atkinson and Gilmanton Academy grant
  - Beans grant
  - Beans purchase
  - Cambridge township
  - Chandlers purchase
  - County subdivisions not defined
  - Crawfords purchase
  - Cutts grant
  - Dixs grant
  - Dixville township
  - Ervings location
  - Greens grant
  - Hadleys purchase
  - Kilkenny township
  - Livermore town
  - Low and Burbanks grant
  - Martins location
  - Odell township
  - Pinkhams grant
  - Sargents purchase
  - Second College grant
  - Success township
  - Thompson and Meserves purchase
  - Wentworth location
# School districts by Census's name, where it isn't the district table's name with or without " School
# District". Each level's "Remainder of New Hampshire" (the area outside that level's districts) is
# left out.
district_aliases:
  "Derry School District": Derry Cooperative
  "Exeter Regional Cooperative School District": Exeter Region Cooperative
  "Prospect Mountain High School Joint Maintenance Agreement District": Prospect Mountain JMA
  "Hale's Location School District": "Hale's Location (Carroll County)"
  "Inter-Lakes School District": Inter-Lakes Cooperative
  "Lincoln-Woodstock School District": Lincoln-Woodstock Cooperative
  "Oyster River Cooperative School District": Oyster River Coop
  "White Mountain Regional School District": White Mountains Regional
  "Wilton-Lyndeborough School District": Wilton-Lyndeborough Cooperative
  "Rivendell Interstate School District": Rivendell

topics:  # acs_topic: each has a materialized view per level (town_acs_<topic>, district_acs_<topic>, state_acs_<topic>)
  1: { code: population, name: "Population and age" }
  2: { code: children, name: "Children and births" }
  3: { code: households, name: "Households and families" }
  4: { code: race_language, name: "Race, origin and language" }
  5: { code: education, name: "Education" }
  6: { code: income, name: "Income and earnings" }
  7: { code: poverty, name: "Poverty and assistance" }
  8: { code: work, name: "Work and commuting" }
  9: { code: health_internet, name: "Health, disability and internet" }
  10: { code: housing, name: "Housing" }

# acs_table: the tables loaded, by topic. core: likely to be used soon; extended: kept for later.
