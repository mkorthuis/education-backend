# The {level}_acs_summary views' measures, in order (acs_measure). value: one estimate; sum: estimates added
# up; share: the sum of share as a percentage of the sum of of (a "-" subtracts a line). Margins of error
# follow Census's formulas for sums and proportions. label and description are what the site shows.
summary:
  population:
    label: "Population"
    description: "All residents."
    value: B01001_001
  median_age:
    label: "Median age"
    description: "Half of residents are older, half younger, in years."
    value: B01002_001
  children_under_6:
    label: "Children under 6"
    description: "Children under 6 living in households (under 3, 3 and 4, and 5)."
    sum: [B09001_003, B09001_004, B09001_005]
  children_under_18:
    label: "Children under 18"
    description: "Children under 18, in households and group quarters."
    value: B09001_001
  births_past_year:
    label: "Recent births"
    description: "Women 15 to 50 who gave birth in the past 12 months: an early signal of future kindergarten classes."
    value: B13016_002
  households:
    label: "Households"
    description: "Occupied homes: a household is everyone living in one."
    value: B11001_001
  households_with_children_pct:
    label: "Households with children"
    description: "Share of households with at least one person under 18."
    share: [B11005_002]
    of: [B11005_001]
  single_parent_families_pct:
    label: "Single-parent families"
    description: "Share of families with their own children under 18 that have a single parent (no spouse present)."
    share: [B11003_010, B11003_016]
    of: [B11003_003, B11003_010, B11003_016]
  under_6_all_parents_working_pct:
    label: "Children under 6 with all parents working"
    description: "Share of children under 6 living with their parents whose parents all work or are looking for work (both of two parents, or a single parent): the usual measure of child care demand."
    share: [B23008_004, B23008_010, B23008_013]
    of: [B23008_002]
  age_6_17_all_parents_working_pct:
    label: "Children 6 to 17 with all parents working"
    description: "Share of children 6 to 17 living with their parents whose parents all work or are looking for work: a measure of before- and after-school care demand."
    share: [B23008_017, B23008_023, B23008_026]
    of: [B23008_015]
  median_household_income:
    label: "Median household income"
    description: "Half of households had more income in the past 12 months, half less, in the release's last year's dollars."
    value: B19013_001
  median_family_income:
    label: "Median family income"
    description: "The same for families (households of people related by birth, marriage or adoption), in the release's last year's dollars."
    value: B19113_001
  per_capita_income:
    label: "Per capita income"
    description: "All residents' income in the past 12 months divided by the population, in the release's last year's dollars."
    value: B19301_001
  gini_index:
    label: "Income inequality (Gini index)"
    description: "From 0 (every household has the same income) to 1 (one household has all of it)."
    value: B19083_001
  poverty_pct:
    label: "Poverty rate"
    description: "Share of people whose family income in the past 12 months was below the poverty level."
    share: [B17001_002]
    of: [B17001_001]
  under_18_poverty_pct:
    label: "Child poverty rate"
    description: "Share of children under 18 whose family income was below the poverty level."
    share: [B17020_003, B17020_004, B17020_005]
    of: [B17020_003, B17020_004, B17020_005, B17020_011, B17020_012, B17020_013]
  under_6_poverty_pct:
    label: "Poverty rate, children under 6"
    description: "Share of children under 6 whose family income was below the poverty level."
    share: [B17020_003]
    of: [B17020_003, B17020_011]
  below_185_poverty_pct:
    label: "Below 185% of poverty"
    description: "Share of people whose family income was under 1.85 times the poverty level: the income line for free and reduced-price school meals."
    share: [C17002_002, C17002_003, C17002_004, C17002_005, C17002_006]
    of: [C17002_001]
  under_6_below_200_poverty_pct:
    label: "Children under 6 below 200% of poverty"
    description: "Share of children under 6 whose family income was under twice the poverty level, a common low-income line."
    share: [B17024_003, B17024_004, B17024_005, B17024_006, B17024_007, B17024_008, B17024_009, B17024_010]
    of: [B17024_002]
  snap_households_pct:
    label: "Households on SNAP"
    description: "Share of households that received SNAP (food stamps) in the past 12 months."
    share: [B22002_002]
    of: [B22002_001]
  snap_households_with_children:
    label: "SNAP households with children"
