  private_k12_pct:
    label: "Private school or home school, K-12"
    description: "Share of students in kindergarten through grade 12 in private school; the ACS counts home school as private."
    share: [B14002_009, B14002_012, B14002_015, B14002_018, B14002_033, B14002_036, B14002_039, B14002_042]
    of: [B14002_007, B14002_010, B14002_013, B14002_016, B14002_031, B14002_034, B14002_037, B14002_040]
  age_5_17_other_language_pct:
