# Restraints and seclusions at private (nonpublic) schools, from NHED's restraint and seclusion
# reports (https://www.education.nh.gov/who-we-are/division-of-educator-and-analytic-resources/bureau-of-education-statistics/restraint-and-seclusion):
# the nonpublic pages at the end of each year's report to the legislature (2018-19 to 2022-23, and
# 2025-26's "corrected annual" report) and the separate "NonPublic School Restraint and Seclusion
# Report" (2023-24, 2024-25). Earlier years have only statewide nonpublic totals. The page needs a
# normal browser window. Loaded by app/etl/private_safety.py.
#
# The reports are PDFs. Each year's school rows were copied once into a CSV (one row per school,
# repeats in the 2020-21 and 2021-22 reports dropped); the column headed "Restraints Resulting Death"
# is the one the reports' summaries total as "restraints resulting in serious injury or death".
file_settings:
  default_input: "../assets/private-safety/nonpublic-restraint-seclusion-****.csv"
  year_start: 2019
  year_end: 2026

# Each report's printed nonpublic totals, which the year's CSV rows must add up to. 2019-20's school
# rows come to 16,134 students against its printed 16,155, so its enrollment isn't checked.
expected_totals:
  2019: {enrollment: 15990, restraint_reports: 3005, restraints_bodily_harm: 18, restraints_serious_injury_or_death: 0,
         restraint_investigations_active: 0, restraint_investigations_closed: 3005,
         seclusion_reports: 1564, seclusion_investigations_active: 0, seclusion_investigations_closed: 1564}
  2020: {restraint_reports: 1827, restraints_bodily_harm: 4, restraints_serious_injury_or_death: 0,
         restraint_investigations_active: 0, restraint_investigations_closed: 1827,
