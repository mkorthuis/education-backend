# Each year is a snapshot of the state's current lists; years are loaded in order,
# so schools that later close keep their rows
file_settings:
  year_start: "2025"
  year_end: "2026"
  school_file:
    default_input: "../assets/****-school-list.xls"
    start_row: 2  # 0-based index, skip header row
  district_file:
    default_input: "../assets/****-district-list.csv"
  sau_file:
    default_input: "../assets/****-sau-list.xls"
    start_row: 4  # 0-based index, skip header row

column_mappings:
  # School file mappings
  district_id: 0
  district_name: 1
  school_id: 2
  school_name: 3
  open_date: 4
  principal_first_name: 5
  principal_middle_initial: 6
  principal_last_name: 7
  principal_title: 8
  address1: 9
  address2: 10
  city: 11
  state: 12
  zip: 13
  phone: 14
  fax: 15
  email: 16
  county: 17
  region_name: 18
  school_group: 19
  school_type: 20
  school_type_desc: 21
  school_approval_level: 22
  school_approval_level_desc: 23
  grade_span: 24
  sau_id: 25
  sau_name: 26
  admin_type: 27  
  group_id: 28
  webpage: 30

# Schools whose website in the state's school list is broken or missing, with the school's own
# working site. Applied after every load (location.apply_website_corrections), so a correction
# outlasts the next year's list; one for a school the database doesn't have stops the load.
website_corrections:
  - school_id: 21180  # St. Joseph Regional School (Keene)
    webpage: https://www.stjosephkeene.org/
    note: The state's list gives http://sites.google.com/site/stjosephregionalschool, which asks for a Google sign-in (checked November 16, 2026).
  - school_id: 29235  # Our Lady of Mercy Academy (Keene)
    webpage: https://www.mercyacademykeene.org/
    note: The state's list gives https://www.mercy.academy/, which didn't connect on November 16, 2026.
  - school_id: 29282  # Granite Valley Preparatory Chartered Public School (Keene)
    webpage: https://www.granitevalleyprep.org/
    note: The state's list gives no website.
