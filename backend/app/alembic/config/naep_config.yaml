# NAEP, the National Assessment of Educational Progress ("the Nation's Report Card"): results for
# every state, DC, the Department of Defense schools (DoDEA) and the nation's public schools, from
# NCES's NAEP Data Service (https://www.nationsreportcard.gov/Dataservice/GetAdhocData.aspx), the
# data behind the NAEP Data Explorer (https://www.nationsreportcard.gov/ndecore/xplore/NDE).
#
# `python -m app.etl fetch naep` asks the Data Service for everything below and saves it under
# assets/naep/ (four files per subject and grade); `python -m app.etl load naep` loads those files.
# The saved files keep each record's fields that the loader reads, and the query URLs that
# produced them. Each request takes 15 to 60 seconds; the fetch runs four at a time.
#
#   results-<subject>-grade<g>.json        type=data: each measure, place and year
#   compare-states-<subject>-grade<g>.json type=sigacrossjuris over every state, DC and DoDEA, all years
#                                          in one request (places are compared within each year). Only
#                                          New Hampshire's comparisons are kept. These are NAEP's own
#                                          tests, adjusted for the many comparisons made at once, as in
#                                          NAEP's state reports.
#   compare-nation-<subject>-grade<g>.json type=sigacrossjuris for New Hampshire and the national public
#                                          average alone: a test of the two places only
#   compare-years-<subject>-grade<g>.json  type=sigacrossyear, the latest year against each earlier year,
#                                          one pair of years per request, for every place
#   groups-results-, groups-compare-nation- and groups-compare-years-<subject>-grade<g>.json: the same
#                                          for each student group below, for New Hampshire and the
#                                          national public average (group_jurisdictions)
#
# To add a NAEP year: add it to `years`, raise year_end, then fetch and load.
file_settings:
  year_start: 2003
  year_end: 2024
  directory: "../assets/naep"

# Every state has taken NAEP reading and math in grades 4 and 8 since 2003, in the sample that
# allows accommodations (R3)
years: [2003, 2005, 2007, 2009, 2011, 2013, 2015, 2017, 2019, 2022, 2024]
sample: R3

# Data Service subject → its composite scale, the subject code in its results, and the
# assessment_subject it's stored under
subjects:
  mathematics: { scale: MRPCM, code: MAT, assessment_subject: mat }
  reading: { scale: RRPCM, code: RED, assessment_subject: rea }

# NAEP grade → the grades row it's stored under
grades:
  4: Grade 4
  8: Grade 8

# Data Service stattype → naep_measure, inserted in this order
measures:
  "MN:MN": { name: Average scale score, unit: score }
  "ALC:AB": { name: At or above NAEP Basic, unit: percent }
  "ALC:AP": { name: At or above NAEP Proficient, unit: percent }
  "ALC:AD": { name: At NAEP Advanced, unit: percent }

# Measures with significance tests
compared_measures: ["MN:MN", "ALC:AP"]

# NAEP student groups loaded, by NAEP's variable and category codes, inserted in this order. All
# students are loaded for every place; the other groups for group_jurisdictions, with New Hampshire's
# tests against the nation and against its own earlier years. These are the groups NAEP reports for
# New Hampshire in most years. A group NAEP doesn't report for a place and year (too few students to
# meet its reporting standards) is loaded as not displayable. ECONDIS is NAEP's economically
# disadvantaged status from 2024; NAEP gives its earlier years from school lunch eligibility (NSLP),
# which it relabeled. Its third category, "Information not available", isn't loaded.
student_groups:
  TOTAL: { name: All students, values: { "1": All students } }
  GENDER: { name: Sex, values: { "1": Male, "2": Female } }
  ECONDIS:
    name: Economic status
    values: { "1": Economically disadvantaged, "2": Not economically disadvantaged }
  IEP2009:
    name: Disability status (a student with only a 504 plan counts as without a disability)
    values: { "1": Students with disabilities, "2": Students without disabilities }
  SRACE10:
    name: Race/ethnicity
    values:
      "1": White
      "2": Black
      "3": Hispanic
      "4": Asian
      "5": American Indian/Alaska Native
      "6": Native Hawaiian/Other Pacific Islander
      "7": Two or more races
  UTOL4: { name: School location, values: { "1": City, "2": Suburb, "3": Town, "4": Rural } }
  LEP: { name: English learner status, values: { "1": English learners, "2": Not English learners } }

group_jurisdictions: [NH, NP]

# Comparisons are kept with this place first ("New Hampshire against Massachusetts")
focal_jurisdiction: NH

# Whether NAEP reports a figure is its isStatDisplayable marker, which the loader follows. A record's
# errorFlag is a set of NAEP's footnotes (on race, disability status, DoDEA and so on) and isn't
# loaded; no bit of it matches isStatDisplayable exactly.

# NAEP place code → jurisdiction, inserted in this order: the nation, then the states and DC
# alphabetically, then DoDEA. Names are NAEP's labels.
jurisdictions:
  NP: { name: National public, kind: nation }
  AL: { name: Alabama, kind: state }
  AK: { name: Alaska, kind: state }
