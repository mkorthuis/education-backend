# Ballot Question 2, required by HB 1300 (2026 chapter 324, RSA 32:5-i) at the 2026 and 2028
# general elections: one question on a school property tax cap and a 6% cap on SAU central-office
# spending. A school district adopts the tax cap when at least 60% of the voters in all its towns
# vote yes; an SAU adopts the spending cap when at least 60% of the voters across all the SAU's
# towns vote yes. Each election has three files in assets/question-two:
#
# - districts: one row per school district: the district table's name, WMUR's name, the votes,
#   WMUR's percentage and result, and the towns
# - saus: one row per SAU, by its number (the sau table's id): the votes, percentage and result,
#   the towns WMUR lists under it, and a note where WMUR's listing leaves a town out or puts one in
#   the wrong SAU
# - towns: one row per town, by the town table's name: the town's own votes (towns don't decide
#   either cap on their own), with a note where WMUR's rows were added together
#
# The 2026 results are WMUR's town-by-town table, updated November 9, 2026, which lists each town
# with its own vote, its school districts' totals and one SAU's total. They are unofficial: a
# district's result is final once its school board ratifies its towns' results and reports them to
# the Department of Revenue Administration. A copy of WMUR's page is in
# additional-data/raw/question-two/. WMUR's listing has these gaps, noted in the files:
#
# - Allenstown (SAU 53) is listed under SAU 4, so SAU 4's total includes it and SAU 53's doesn't
# - Each town is listed under one SAU: Ashland only under SAU 2, though its voters are also in the
#   Pemi-Baker Regional School District (SAU 48), and Hampton only under SAU 21 (Winnacunnet), so
#   there's no total for SAU 90 (the Hampton School District)
# - Concord is listed in two parts, the Concord School District and the part in Merrimack Valley,
#   added together in the towns file
#
# `python -m app.etl load question-two` loads every election below. When certified results are
# published, replace the files, set official: true, update the source and load again.
directory: "../assets/question-two"
threshold_percent: 60

elections:
  2026:
    districts: question-two-2026-districts.csv
    saus: question-two-2026-saus.csv
    towns: question-two-2026-towns.csv
    source_url: "https://www.wmur.com/article/town-district-question-2-results-nh-110926/74379244"
    # Shown with the Ask's answers that use these results
    source_label: "WMUR: Question 2 results by town and school district (unofficial)"
    as_of: "2026-11-09"
    official: false
