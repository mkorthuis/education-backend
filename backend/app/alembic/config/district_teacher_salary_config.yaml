file_settings:
  # Supports both .xlsx and .xls extensions
  teacher_salary_file: '../assets/staff/teacher-average-salary/****-Teacher-Salary'
  # Automatically using the first sheet in each Excel file
  start_row: 8
  years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  legacy_years: [2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022]
  modern_years: [2023, 2024, 2025]
  sql_cache_dir: '../sql_cache'

column_mappings:
  # For years 2023+ 
  district_id: 2
  salary: 5
  
  # For legacy years (2008-2022)
  # District name could be in column 0 or 1, with salary always at district_col + 2
  legacy_district_name_col0: 0
  legacy_salary_col0: 2
  legacy_district_name_col1: 1
  legacy_salary_col1: 3 

# Settings for identifying and processing state-level data
state_data_settings:
  # Modern years (2023+)
  # The column index (0-based) where the state identifier text is expected to be found
  modern_state_column_index: 3
  # The text string that identifies a row as containing state data (case-insensitive)
  modern_state_identifier_text: "State Average Salary"
  
  # Legacy years (2008-2022)
  # State data is identified in the district name columns
  # The text string that identifies a row as containing state data (case-insensitive)
  legacy_state_identifier_text: "State Average Salary" 