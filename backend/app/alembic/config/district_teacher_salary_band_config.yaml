file_settings:
  # The first of these extensions that exists is used
  default_input: '../assets/staff/teacher-starting-salary/****-Teacher-Starting'
  extensions: ['.xlsx', '.xls']
  # We'll process the first sheet by default
  start_row: 8
  # Loaded from 2024; earlier files are minimum starting salary reports with a different layout
  year_start: 2024
  year_end: 2026

column_mappings:
  district_id: 2
  salary_band_type: 4  # Teacher salary band type column (BA, BA15, MA, etc.)
  min_salary: 5        # Minimum salary for this band
  max_salary: 6        # Maximum salary for this band
  steps: 7             # Number of steps in this salary band

# teacher_salary_band_type rows: [id, name, description]
salary_band_types:
  - [1, "BA", "Bachelors"]
  - [2, "BA15", "Bachelors + 15 credits"]
  - [3, "BA30", "Bachelors + 30 credits"]
  - [4, "MA", "Masters"]
  - [5, "MA15", "Masters + 15 credits"]
  - [6, "MA30", "Masters + 30 credits"]
  - [7, "MA45", "Masters + 45 credits"]  # first reported in 2024-2025

# Mapping from names in Excel file to teacher_salary_band_type.id values
salary_band_mapping:
  "BA": 1
  "B.A.": 1
  "Bachelor": 1
  "Bachelors": 1
  "BA+15": 2
  "BA15": 2
  "B.A.+15": 2
  "Bachelors+15": 2
  "BA+30": 3
  "BA30": 3
  "B.A.+30": 3
  "Bachelors+30": 3
  "MA": 4
  "M.A.": 4
  "Master": 4
  "Masters": 4
  "MA+15": 5
  "MA15": 5
  "M.A.+15": 5
  "Masters+15": 5
  "MA+30": 6
  "MA30": 6
  "M.A.+30": 6
  "Masters+30": 6
  "MA+45": 7
  "MA45": 7
  "M.A.+45": 7
  "Masters+45": 7
# NH DOE's files have typos: a $14 minimum, a maximum below the minimum, 1,300 steps. A row whose
# minimum is below min_salary or whose maximum is below its minimum is skipped; a step count above
# max_steps is dropped and the row kept. Each is logged, for reporting to NH DOE.
limits:
  min_salary: 20000
  max_steps: 60

# Values from a district's own published schedule that replace NH DOE's, applied before the limits.
# Each needs the schedule as its source. year is the year the school year ends (2026 = 2025-26).
corrections:
