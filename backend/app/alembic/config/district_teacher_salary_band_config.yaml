    year: 2026
    band: BA
    min_salary: 42571
    max_salary: 87571
    steps: 46
    source: https://drive.google.com/file/d/1Hlw-rLE7O1EMIfzVKw2PBmRt8w5m2xIf/view
    note: Conway Annual Report FY2025, Appendix B, 2025-26 Salary Schedule, p. 42, column B. NH DOE's BA row ($40,442-$83,192) is the schedule's non-degree (ND) column.
  - district_id: 113  # Conway
    year: 2026
    band: MA
    steps: 46
    source: https://drive.google.com/file/d/1Hlw-rLE7O1EMIfzVKw2PBmRt8w5m2xIf/view
    note: Same schedule, column M, which has 46 steps like every column; NH DOE's file has 464.
