# Where each district's students go for the grades it doesn't run, and the schools outside New
# Hampshire they attend. The Ask's reference lookup follows these links both ways, so a question about
# Jackson also gets facts about Josiah Bartlett Elementary (Bartlett), Kennett High (Conway) and Fryeburg
# Academy, and one about Conway gets those of the districts that send it students. Loaded with the
# library (`python -m app.etl load reference`). A test checks that every cooperative and interstate
# district in the state's district/town list has a row for each member district.
#
# district_service rows:
#   district / receiving_district: names exactly as in the site's district table
#   outside_school: "Name (ST)", one of the outside_schools below
#   grades: [low, high], with K for kindergarten
#   arrangement: tuition_contract | area_agreement | cooperative | choice | no_contract |
#                interstate_district | joint_maintenance
#     choice: families may choose the school and the district pays up to a set amount
#     no_contract: the district pays tuition there without a written contract posted
#     interstate_district: a district formed with Vermont towns (Dresden, Rivendell)
#     joint_maintenance: a school two districts run together under RSA 194:21 (Prospect Mountain)
#   starts / ends: the contract's dates, where known
#   source: the contract, or the page or minutes that describe the arrangement
#
# SAU 9 and SAU 13 were gathered November 13, 2026 from the town research (town/<Town>/README.md in
# the education folder); the rest November 15, 2026 from each district's contracts, policies, board
# minutes and annual reports, the State Board of Education's approvals, and, for cooperative members,
# the state's district/town list.

